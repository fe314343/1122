<!doctype html><html lang="zh-Hant"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>TRT 藥劑配送</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f6f7;color:#193c47;font:16px/1.6 system-ui,'Microsoft JhengHei',sans-serif}button,input,select{font:inherit}button{border:0;border-radius:10px;min-height:46px;padding:10px 18px;background:#087f80;color:white;cursor:pointer}button:disabled{opacity:.45;cursor:default}.light{background:#e5f1f1;color:#076d72}.danger{background:#fff0ee;color:#a33d2c}header{padding:18px 24px;background:white;border-bottom:1px solid #dbe6e9;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:23px}h2{font-size:21px;margin:0 0 12px}h3{font-size:17px;margin:0}p{margin:10px 0}main{max-width:1050px;margin:auto;padding:22px 16px 100px}nav{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}small,.muted{font-size:14px;color:#71858b}.panel{background:white;border:1px solid #dce7e9;border-radius:14px;padding:20px;margin-bottom:15px}.list{background:white;border:1px solid #dce7e9;border-radius:14px;overflow:hidden}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px;border-bottom:1px solid #edf1f2}.row:last-child{border:0}.selected{background:#edf9f6}.step{display:flex;gap:5px;align-items:center}.step button{padding:0;width:44px;font-size:24px}.step input{width:64px;height:46px;text-align:center;border:1px solid #cbdcdd;border-radius:8px;background:white;appearance:textfield}.step input::-webkit-inner-spin-button{appearance:none}input,select{max-width:100%;padding:10px;border:1px solid #cbdcdd;border-radius:8px;background:white}.bar{position:sticky;bottom:10px;margin-top:16px;background:#173e4a;color:white;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-radius:12px;gap:10px}.tag{background:#e7f4ef;color:#19714f;padding:3px 9px;border-radius:6px;font-size:14px}.pending{background:#fff0d2;color:#8f6414}.warning{background:#fff5df;padding:12px;border-radius:9px;color:#835b19}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.big{font-size:29px;font-weight:750}.two{display:flex;gap:18px;justify-content:space-between}.card-button{background:white;color:inherit;text-align:left;width:100%;border:1px solid #dce7e9;margin-bottom:12px;padding:18px}dialog{border:0;border-radius:15px;padding:24px;width:min(94%,530px);max-height:90vh;overflow:auto;color:#193c47}dialog::backdrop{background:#153e4a99}label{display:block;margin:15px 0}.error{background:#ffeded;color:#a1352c;padding:12px;border-radius:9px;margin-bottom:15px}.notice{padding:12px;background:#e8f4f4;border-radius:9px;margin-bottom:16px}#busy{font-size:14px;color:#087f80}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#193e49;color:white;padding:13px 20px;border-radius:10px;z-index:9;max-width:92%;width:max-content}footer{font-size:14px;color:#70868d;margin-top:24px}@media(max-width:650px){header{padding:12px 16px}h1{font-size:20px}.grid{grid-template-columns:1fr 1fr}.row{padding:12px}.step input{width:48px}.step button{width:40px}.panel{padding:15px}.bar{padding:12px}.two{gap:10px}main{padding-bottom:50px}}
</style></head><body><header><h1>TRT 藥劑配送</h1><span id="identity">正在連線…</span><span id="busy" role="status"></span></header><main><div id="error" role="alert"></div><div id="app"></div><footer>叫藥與庫存紀錄儲存在管理試算表。網站關閉後的手機推播尚未啟用。</footer></main><dialog id="modal"></dialog><div id="toast" hidden role="status"></div><script>
let token='',data=null,page='order',busy=false,seen=new Set(),primed=false,pending=null,selected={},notice='',pollTimer;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,6000)}
function fail(s){$('#error').innerHTML='<div class="error">'+esc(s)+'</div>'}
function id(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();return 'req-'+Date.now()+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2)}
function rpc(req){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>r&&r.ok?resolve(r):reject(Object.assign(Error(r&&r.message||'伺服器沒有確認成功'),{confirmed:!r.retrySameRequest}))).withFailureHandler(e=>reject(Error(e.message||'連線中斷，請稍後重試'))).api(Object.assign({token},req)))}
function setBusy(b){busy=b;$('#busy').textContent=b?'處理中，請稍候…':'';document.querySelectorAll('button[data-write]').forEach(x=>x.disabled=b)}
function checkUpdates(next){let updates=[];for(const o of next.orders){const key=o.id+':'+o.status;if(!seen.has(key)&&primed&&((next.user.role==='admin'&&o.status==='待確認')||(next.user.role==='customer'&&o.status!=='待確認')))updates.push(o);seen.add(key)}primed=true;if(updates.length){notice=next.user.role==='admin'?'有新的叫藥需求':'您的訂單處理狀態已更新';toast(notice)}}
async function refresh(manual=false){if(busy)return;try{let r=await rpc({action:'read'});checkUpdates(r);if(!data||r.version>=data.version)data=r;if(page!=='order'||manual)render();if(manual)toast('已更新最新紀錄')}catch(e){if(manual||!data)fail(e.message)}}
async function mutate(payload){if(busy)return;$('#error').innerHTML='';if(pending&&JSON.stringify(pending.payload)!==JSON.stringify(payload)){fail('前一筆操作尚未確認，請先重試或重新整理核對訂單，避免重複處理');return}if(!pending)pending={payload,requestId:id()};setBusy(true);try{const r=await rpc(Object.assign({},pending.payload,{requestId:pending.requestId}));checkUpdates(r);data=r;pending=null;$('#modal').close();if(payload.action==='order'){selected={};page='history'}render();toast(payload.action==='receive'?'已回覆收到；請查看清單的庫存預留狀態':'操作已儲存')}catch(e){if(e.confirmed)pending=null;fail(e.message+(e.confirmed?'':'。重試相同操作會沿用交易編號，請勿重複建立訂單。'))}finally{setBusy(false)}}
function go(p){page=p;render()}
function nav(){const admin=data.user.role==='admin';return `<nav>${admin?'<button class="light" onclick="go(\'history\')">訂單管理</button><button class="light" onclick="go(\'stock\')">庫存管理</button>':'<button class="light" onclick="go(\'order\')">叫藥需求</button><button class="light" onclick="go(\'history\')">我的訂單</button>'}<button class="light" onclick="refresh(true)">重新整理</button></nav>${notice?'<div class="notice">'+esc(notice)+'</div>':''}`}
function render(){if(!data)return;$('#identity').textContent=data.user.role==='admin'?'管理員':data.user.company;$('#app').innerHTML=nav()+(page==='stock'?stock():page==='history'?history():form());if(page==='order')updateCount()}
function form(){return `<h2>${esc(data.user.company)} · 叫藥</h2><p class="muted">選數量後送出，不需要的品項維持 0。</p><form id="orderForm" onsubmit="submit(event)"><div class="list">${data.products.map(p=>`<div class="row ${selected[p.id]?'selected':''}" id="r-${p.id}"><div><strong>${p.name}</strong><br><small>${p.kg}kg／${p.unit}</small></div><div class="step"><button type="button" class="light" aria-label="減少${p.name}" onclick="step('${p.id}',-1)">−</button><input type="number" inputmode="numeric" min="0" max="9999" step="1" aria-label="${p.name}數量" id="q-${p.id}" value="${selected[p.id]||0}" oninput="selectQty('${p.id}',this.value)"><button type="button" aria-label="增加${p.name}" onclick="step('${p.id}',1)">＋</button></div></div>`).join('')}</div><div class="bar"><strong id="count" aria-live="polite"></strong><button id="send" data-write>送出需求</button></div></form>`}
function selectQty(k,v){selected[k]=Number(v);$('#r-'+k).classList.toggle('selected',selected[k]>0);updateCount()}
function step(k,d){let q=Math.min(9999,Math.max(0,(Number(selected[k])||0)+d));$('#q-'+k).value=q;selectQty(k,q)}
function updateCount(){let n=Object.values(selected).filter(q=>q>0).length;$('#count').textContent=n?'已選 '+n+' 種藥劑':'尚未選擇';$('#send').disabled=busy||!n}
function submit(e){e.preventDefault();let items={};for(let p of data.products){let n=Number($('#q-'+p.id).value);if(!Number.isSafeInteger(n)||n<0||n>9999)return fail('請填 0～9999 的整數');if(n)items[p.id]=n}if(!Object.keys(items).length)return;mutate({action:'order',items})}
function dt(s){return s?new Date(s).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'—'}
function itemText(o){return Object.entries(o.items).map(([k,q])=>{const p=data.products.find(p=>p.id===k);return p.name+' '+q+p.unit}).join('、')}
function history(){return `<h2>${data.user.role==='admin'?'訂單管理':'我的訂單'}</h2>${data.user.role==='admin'?'<label>公司篩選 <select id="filter" onchange="filterOrders(this.value)"><option>全部</option><option>弘大</option><option>永達</option><option>宏悅</option></select></label>':''}<div id="orderCards">${cards(data.orders)}</div><details class="panel"><summary>改版前的歷史紀錄</summary><p class="muted">舊紀錄只供查閱，不會扣除目前庫存。</p><button onclick="loadLegacy()">讀取舊紀錄</button><div id="legacy"></div></details>`}
async function loadLegacy(){try{const r=await rpc({action:'legacy'});$('#legacy').innerHTML=r.legacy.length?r.legacy.map(o=>`<div class="row"><div><strong>${esc(o.company)}</strong><br><small>${esc(o.at)}</small><p>${esc(itemText(o))}</p></div><span class="tag">舊紀錄</span></div>`).join(''):'<p class="muted">找不到同名公司工作表中的舊紀錄。</p>'}catch(e){fail(e.message)}}
function cards(list){return list.length?list.map(o=>`<button class="card-button" onclick="detail('${o.id}')"><div class="two"><strong>${esc(o.company)}</strong><span class="tag ${o.status==='待確認'?'pending':''}">${o.status}</span></div><p>${esc(itemText(o))}</p><small>${dt(o.at)} · ${o.id.slice(0,8)}</small></button>`).join(''):'<div class="panel">目前沒有訂單。</div>'}
function filterOrders(c){$('#orderCards').innerHTML=cards(data.orders.filter(o=>c==='全部'||o.company===c))}
function detail(id){let o=data.orders.find(o=>o.id===id);if(!o)return;const admin=data.user.role==='admin',active=!['已出貨','已取消'].includes(o.status);$('#modal').innerHTML=`<h2>${esc(o.company)} · 訂購清單</h2><small>${dt(o.at)} · ${o.id.slice(0,8)}</small>${Object.entries(o.items).map(([k,q])=>{const p=data.products.find(p=>p.id===k);return `<div class="row"><strong>${p.name}</strong><span>${q} ${p.unit}</span></div>`}).join('')}<p><span class="tag">${o.status}</span></p>${o.receivedAt?'<p>已收到時間：'+dt(o.receivedAt)+'</p>':''}${admin&&active?`<p class="${o.receivedAt&&!o.reserved?'warning':'muted'}">${o.reserved?'庫存已預留':o.receivedAt?'庫存不足，待補貨後預留':'尚未預留庫存'}</p>${o.status==='待確認'?`<button data-write style="width:100%;font-size:22px" onclick="orderAction('receive','${o.id}')">收到</button>`:o.reserved?`<button data-write onclick="orderAction('ship','${o.id}')">確認出貨並扣庫存</button>`:`<button data-write onclick="orderAction('reserve','${o.id}')">重新預留庫存</button>`}<p><button class="danger" data-write onclick="cancelOrder('${o.id}')">取消訂單</button></p>`:''}<p><button class="light" onclick="$('#modal').close()">關閉</button></p>`;$('#modal').showModal()}
function orderAction(action,orderId){mutate({action,orderId})}
function cancelOrder(orderId){if(confirm('確定取消這筆訂單並解除預留？'))mutate({action:'cancel',orderId})}
function stock(){return `<div class="two"><h2>倉庫庫存</h2><button onclick="adjustForm()">登記異動</button></div><p class="muted">實際庫存 − 已預留 = 可用庫存。泡藥按一天一種、24 桶規劃。</p><div class="grid">${data.inventory.map(i=>{const p=data.products.find(p=>p.id===i.id);return `<section class="panel"><h3>${p.name}</h3><small>${p.kg}kg／${p.unit}</small><div class="big">${i.onHand} ${p.unit}</div><div class="two"><small>已預留 ${i.reserved}</small><strong>可用 ${i.available}</strong></div>${i.low?'<p class="warning">'+(p.id==='brownCarbon'?'請確認廠商庫存':'請安排補貨')+'</p>':''}<p class="muted">${p.id==='MC2'?'不提醒補貨':p.id==='FB'?'每次採購 50 包':p.leadDays?'採購交期約 '+p.leadDays+' 天':p.source==='自泡'?'自行泡製':p.threshold!==undefined?'提醒門檻 '+p.threshold+p.unit:''}</p></section>`}).join('')}</div><div class="panel"><h3>近期庫存異動</h3>${data.movements.map(e=>`<div class="row"><span>${e.type==='ship'?'訂單出貨':data.products.find(p=>p.id===e.product).name+' '+(e.delta>0?'+':'')+e.delta}<br><small>${esc(e.note||e.orderId)}</small></span><small>${dt(e.at)}</small></div>`).join('')||'<p class="muted">尚無異動</p>'}</div><p class="muted">黑色活性碳、FB 與泡藥的需求預測，待匯入歷史資料後校正；目前不產生自動採購日期。</p>`}
function adjustForm(){$('#modal').innerHTML=`<h2>登記庫存異動</h2><label>品項 <select id="product">${data.products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></label><label>類型 <select id="kind"><option value="in">採購入庫</option><option value="make">泡藥入庫</option><option value="out">其他出庫</option></select></label><label>數量 <input id="qty" type="number" min="1" max="9999" step="1" value="1"></label><label>原因 <input id="note" maxlength="300" placeholder="例如：廠商到貨／完成泡藥"></label><p class="muted">訂單出貨請從訂單操作，避免重複扣庫存。</p><button data-write onclick="adjust()">儲存</button> <button class="light" onclick="$('#modal').close()">取消</button>`;$('#modal').showModal()}
function adjust(){const n=Number($('#qty').value),product=$('#product').value,kind=$('#kind').value,p=data.products.find(p=>p.id===product);if(!Number.isSafeInteger(n)||n<1||n>9999)return fail('數量需為正整數');if(kind==='make'&&p.source!=='自泡')return fail('此品項不是自行泡製');const note=$('#note').value.trim();if(!note)return fail('請填異動原因');mutate({action:'adjust',product,delta:kind==='out'?-n:n,note})}
function start(){google.script.url.getLocation(async loc=>{token=loc.parameter.token||'';if(!token){$('#identity').textContent='需要專屬連結';fail('請從公司專屬連結開啟，或向配送窗口索取連結');return}try{data=await rpc({action:'read'});checkUpdates(data);page=data.user.role==='admin'?'history':'order';render();pollTimer=setInterval(()=>{if(!document.hidden)refresh()},30000)}catch(e){$('#identity').textContent='無法登入';fail(e.message)}})}start();
</script></body></html>
