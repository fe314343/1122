<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- 強制軟體化標籤 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="藥劑配送">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e3a8a">
    
    <title>藥劑配送管理系統</title>
    
    <!-- PWA Manifest 設定 (使用您上傳的圖片作為圖示) -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"藥劑配送系統","short_name":"藥劑配送","start_url":".","display":"standalone","orientation":"portrait","background_color":"#1e3a8a","theme_color":"#1e3a8a","icons":[{"src":"0B5915F8-F88F-4653-AC6C-54FBE1D2ACCF.jpg","sizes":"512x512","type":"image/jpeg"}]}'>
    
    <!-- 設定 iOS 桌面圖示 -->
    <link rel="apple-touch-icon" href="0B5915F8-F88F-4653-AC6C-54FBE1D2ACCF.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        :root {
            --sat: env(safe-area-inset-top);
            --sab: env(safe-area-inset-bottom);
        }

        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            background-color: #f1f5f9;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            overflow: hidden;
            height: 100%;
            position: fixed;
            width: 100%;
        }
        #root {
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-top: var(--sat);
            padding-bottom: var(--sab);
        }
        
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }
        .fade-in-overlay { animation: fadeInScale 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInScale { from { opacity: 0; scale: 0.95; } to { opacity: 1; scale: 1; } }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* App 內瀏覽器提示動畫 */
        .bounce-hint { animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-10px);} 60% {transform: translateY(-5px);} }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxcZR0kYEldUdK-Qk_IyDpMpMEtMg4wlq0uI54UhXNZ21x36sVBovmMRgKCDtEc4IUc/exec";

        const Icons = {
            Building: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="18" x="5" y="3" rx="2" ry="2"/><path d="M9 21V9"/><path d="M15 21V9"/><path d="M5 9h14"/></svg>,
            History: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>,
            Package: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16.5 9.4 7.5 4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" x2="12" y1="22" y2="12"/></svg>,
            Send: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" x2="11" y1="2" y2="13"/><polyline points="22 2 15 22 11 13 2 9 22 2"/></svg>,
            CheckCircle: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            Back: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>,
            Smartphone: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>,
            Share: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="22" y2="15"/></svg>,
            MoreVertical: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>,
            PlusSquare: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="12" x2="12" y1="8" y2="16"/><line x1="8" x2="16" y1="12" y2="12"/></svg>,
            Close: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>,
            Refresh: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>,
            External: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>,
            TruckFallback: () => <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-5l-4-4h-3v10a2 2 0 0 0 2 2Z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>
        };

        const AppIcon = ({ className = "" }) => {
            const [imgError, setImgError] = useState(false);
            const fileName = "0B5915F8-F88F-4653-AC6C-54FBE1D2ACCF.jpg";
            if (imgError) return <div className={`flex items-center justify-center bg-blue-800 ${className}`}><Icons.TruckFallback /></div>;
            return <img src={fileName} className={`object-cover ${className}`} alt="Icon" onError={() => setImgError(true)} />;
        };

        const App = () => {
            const [step, setStep] = useState(1);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            const [showPwaTip, setShowPwaTip] = useState(false);
            const [showInstallModal, setShowInstallModal] = useState(false);
            const [isInAppBrowser, setIsInAppBrowser] = useState(false);
            const [historyData, setHistoryData] = useState([]);
            const [formData, setFormData] = useState({
                companyName: '', K1: 0, L1: 0, MC2: 0, S1: 0,
                brownCarbon: 0, blackCarbon: 0, FB: 0, polymer: 0
            });

            useEffect(() => {
                const ua = navigator.userAgent || navigator.vendor || window.opera;
                const inApp = (ua.indexOf("Line") > -1) || (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Instagram") > -1);
                setIsInAppBrowser(inApp);

                const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
                if (!isStandalone) {
                    setShowPwaTip(true);
                }
            }, []);

            const fetchHistory = async () => {
                const name = formData.companyName.trim();
                if (!name) { setError("請先輸入公司名稱"); return; }
                setLoading(true); setError("");
                try {
                    const response = await fetch(`${WEB_APP_URL}?action=getHistory&companyName=${encodeURIComponent(name)}&t=${Date.now()}`);
                    const text = await response.text();
                    let result = JSON.parse(text);
                    if (result.status === "Success") { setHistoryData(result.data || []); setStep(4); } 
                    else { setError(result.message); }
                } catch (err) { setError("連線失敗，請檢查權限。"); }
                finally { setLoading(false); }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true); setError("");
                try {
                    const params = new URLSearchParams();
                    Object.keys(formData).forEach(key => params.append(key, formData[key]));
                    await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: params.toString() });
                    setStep(3);
                } catch (err) { setError("提交發生錯誤。"); }
                finally { setLoading(false); }
            };

            const renderInput = (label, weight, field) => (
                <div className="flex items-center justify-between p-4 bg-gray-50 rounded-2xl mb-3 border border-gray-100 shadow-sm">
                    <div className="flex flex-col text-left">
                        <span className="font-bold text-gray-700">{label}</span>
                        <span className="text-[10px] text-blue-500 font-bold uppercase">{weight}</span>
                    </div>
                    <div className="flex items-center space-x-2">
                        <button type="button" onClick={() => setFormData({...formData, [field]: Math.max(0, formData[field] - 1)})} className="w-10 h-10 flex items-center justify-center bg-white border border-gray-200 rounded-xl shadow-sm font-bold active:bg-gray-100 active:scale-90 transition-all text-xl">-</button>
                        <input type="number" value={formData[field]} onChange={(e) => setFormData({...formData, [field]: parseInt(e.target.value) || 0})} className="w-12 text-center bg-transparent font-black text-indigo-600 outline-none text-2xl" />
                        <button type="button" onClick={() => setFormData({...formData, [field]: formData[field] + 1})} className="w-10 h-10 flex items-center justify-center bg-white border border-gray-200 rounded-xl shadow-sm font-bold active:bg-gray-100 active:scale-90 transition-all text-xl">+</button>
                    </div>
                </div>
            );

            return (
                <div className="flex flex-col h-full bg-slate-100">
                    {/* App 內瀏覽器專用提示 (LINE/FB 使用者會看到這個) */}
                    {isInAppBrowser && (
                        <div className="fixed inset-0 z-[200] bg-black/80 backdrop-blur-md p-10 flex flex-col items-center justify-center text-white text-center">
                            <div className="absolute top-4 right-4 bounce-hint text-indigo-400">
                                <Icons.External />
                            </div>
                            <h2 className="text-2xl font-black mb-4">請使用瀏覽器開啟</h2>
                            <p className="text-gray-300 mb-8 leading-relaxed">LINE/FB 內建瀏覽器不支援 App 安裝功能。<br/>請點擊右上角「...」並選擇「在瀏覽器開啟」。</p>
                            <button onClick={() => setIsInAppBrowser(false)} className="px-8 py-3 bg-indigo-600 rounded-xl font-bold">我知道了</button>
                        </div>
                    )}

                    {/* 安裝導引視窗 */}
                    {showInstallModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/70 backdrop-blur-md transition-all">
                            <div className="bg-white w-full max-w-sm rounded-[2rem] overflow-hidden shadow-2xl fade-in-overlay relative text-left">
                                <button onClick={() => setShowInstallModal(false)} className="absolute right-4 top-4 text-gray-400 p-2"><Icons.Close /></button>
                                <div className="p-8 text-center">
                                    <div className="w-20 h-20 rounded-3xl overflow-hidden mx-auto mb-6 shadow-lg border-4 border-white flex items-center justify-center"><AppIcon className="w-full h-full" /></div>
                                    <h2 className="text-xl font-black text-gray-800 mb-2">安裝藥劑系統</h2>
                                    <p className="text-gray-500 text-sm mb-8 leading-relaxed">安裝後將隱藏網址列，體驗更順暢。</p>
                                    <div className="space-y-6 text-left">
                                        <div className="flex items-start gap-4">
                                            <div className="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center flex-shrink-0 font-bold text-sm">1</div>
                                            <p className="text-sm text-gray-600 leading-relaxed font-medium">點擊瀏覽器工具列的 <strong>分享</strong> 或 <strong>選單</strong> 按鈕</p>
                                        </div>
                                        <div className="flex items-start gap-4">
                                            <div className="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center flex-shrink-0 font-bold text-sm">2</div>
                                            <p className="text-sm text-gray-600 leading-relaxed font-medium">點擊 <strong>「加入主畫面」</strong> 或 <strong>「安裝 App」</strong></p>
                                        </div>
                                    </div>
                                    <button onClick={() => setShowInstallModal(false)} className="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl mt-8 shadow-xl">開始安裝</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    <div className="flex-1 p-4 flex items-start justify-center overflow-y-auto">
                        <div className="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-gray-100 flex flex-col animate-in">
                            <div className="bg-gradient-to-br from-blue-700 to-indigo-900 p-8 text-white relative text-left flex-shrink-0">
                                <div className="absolute right-6 top-6 w-20 h-20 overflow-hidden rounded-2xl shadow-lg border-2 border-white/30 flex items-center justify-center bg-blue-800"><AppIcon className="w-full h-full" /></div>
                                <h1 className="text-3xl font-black mb-1 tracking-tight">藥劑配送</h1>
                                <p className="text-blue-100 opacity-80 text-xs font-medium uppercase tracking-widest">v3.0 Stability Edition</p>
                            </div>

                            {showPwaTip && step === 1 && (
                                <div onClick={() => setShowInstallModal(true)} className="bg-indigo-600 p-4 flex items-center justify-between text-white text-xs font-bold animate-in cursor-pointer hover:bg-indigo-700 transition-colors flex-shrink-0 shadow-lg">
                                    <div className="flex items-center gap-3"><Icons.Smartphone /><span>安裝為獨立軟體 (隱藏網址列)</span></div>
                                    <span className="bg-white/20 px-2 py-1 rounded-lg">引導 ➜</span>
                                </div>
                            )}

                            <div className="p-8" key={step}>
                                {step === 1 && (
                                    <div className="space-y-6 text-left animate-in">
                                        <div className="flex items-center space-x-2 text-indigo-600 font-bold"><Icons.Building /><span>身分確認</span></div>
                                        <input type="text" placeholder="輸入公司名稱" className="w-full p-5 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-indigo-500 text-lg font-medium shadow-inner transition-all" value={formData.companyName} onChange={(e) => setFormData({...formData, companyName: e.target.value})} />
                                        <div className="grid grid-cols-1 gap-4">
                                            <button onClick={() => formData.companyName.trim() ? setStep(2) : setError("請輸入公司名稱")} className="w-full bg-indigo-600 text-white py-5 rounded-2xl font-bold shadow-xl active:scale-[0.98] transition-all h-16 text-lg">下一步</button>
                                            <button onClick={fetchHistory} disabled={loading} className="w-full bg-white text-indigo-600 border-2 border-indigo-50 py-5 rounded-2xl font-bold flex items-center justify-center gap-2 active:scale-[0.98] transition-all h-16 text-lg shadow-sm">{loading ? "🌀 查詢中..." : <Icons.History />}<span>歷史紀錄</span></button>
                                        </div>
                                        {error && <div className="text-red-500 text-sm font-bold bg-red-50 p-4 rounded-2xl border border-red-100 text-center animate-in">{error}</div>}
                                    </div>
                                )}

                                {step === 2 && (
                                    <form onSubmit={handleSubmit} className="space-y-4 animate-in text-left">
                                        <div className="flex justify-between items-center mb-4">
                                            <div className="flex items-center gap-2 font-black text-indigo-600 text-xl"><Icons.Package /><span className="truncate max-w-[150px]">{formData.companyName}</span></div>
                                            <button type="button" onClick={() => setStep(1)} className="text-sm font-bold text-slate-400 underline decoration-2 underline-offset-4">返回</button>
                                        </div>
                                        <div className="max-h-[50vh] overflow-y-auto pr-2 custom-scrollbar">
                                            <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 ml-1">藥劑產品 (桶裝)</h3>
                                            {renderInput("K1 藥劑", "25kg", "K1")}
                                            {renderInput("L1 藥劑", "25kg", "L1")}
                                            {renderInput("MC2 藥劑", "30kg", "MC2")}
                                            {renderInput("S1 藥劑", "25kg", "S1")}
                                            <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest mt-8 mb-4 ml-1">粉劑類 (包裝)</h3>
                                            {renderInput("牛皮紙活性碳", "20kg", "brownCarbon")}
                                            {renderInput("黑色活性碳", "20kg", "blackCarbon")}
                                            {renderInput("FB", "25kg", "FB")}
                                            {renderInput("高分子", "25kg", "polymer")}
                                        </div>
                                        <button type="submit" disabled={loading} className="w-full bg-indigo-600 text-white py-5 rounded-2xl font-bold shadow-2xl mt-6 active:scale-[0.98] transition-all h-16 text-lg">{loading ? "同步中..." : "確認送出申請"}</button>
                                    </form>
                                )}

                                {step === 3 && (
                                    <div className="text-center py-12 space-y-8 animate-in text-slate-800">
                                        <div className="text-emerald-500 flex justify-center scale-125"><div className="w-20 h-20 bg-emerald-50 rounded-full flex items-center justify-center shadow-lg"><Icons.CheckCircle /></div></div>
                                        <div><h2 className="text-3xl font-black">送出成功！</h2><p className="text-slate-500 mt-3 font-medium px-4 leading-relaxed text-sm">資料已同步至管理表格。</p></div>
                                        <button onClick={() => { setFormData({...formData, K1:0,L1:0,MC2:0,S1:0,brownCarbon:0,blackCarbon:0,FB:0,polymer:0}); setStep(1); }} className="w-full bg-slate-800 text-white py-5 rounded-2xl font-bold active:scale-95 transition-all h-16 shadow-lg">返回首頁</button>
                                    </div>
                                )}

                                {step === 4 && (
                                    <div className="space-y-6 animate-in text-left">
                                        <div className="flex items-center justify-between mb-4">
                                            <div className="flex items-center gap-4"><button onClick={() => setStep(1)} className="p-3 bg-slate-50 rounded-2xl text-indigo-600 shadow-sm active:scale-90"><Icons.Back /></button><h2 className="font-black text-2xl text-slate-800">歷史紀錄</h2></div>
                                            <button onClick={fetchHistory} className="p-3 bg-slate-50 rounded-2xl text-slate-400 active:rotate-180 transition-transform duration-500 shadow-sm"><Icons.Refresh /></button>
                                        </div>
                                        <div className="space-y-4 max-h-[50vh] overflow-y-auto pr-2 custom-scrollbar">
                                            {historyData.length === 0 ? <p className="text-center py-20 text-slate-400 italic font-medium">目前查無紀錄</p> : 
                                                historyData.map((item, i) => (
                                                    <div key={i} className="bg-white p-5 rounded-[1.5rem] border border-slate-100 shadow-sm">
                                                        <div className="font-black text-indigo-600 mb-3 border-b border-slate-50 pb-2 flex justify-between"><span className="text-sm">{item.timestamp}</span><span className="text-[10px] text-slate-300">#{(historyData.length - i)}</span></div>
                                                        <div className="grid grid-cols-2 gap-x-4 gap-y-2 text-sm text-slate-600 font-bold">
                                                            {item.K1 > 0 && <span>K1: {item.K1} 桶</span>} {item.L1 > 0 && <span>L1: {item.L1} 桶</span>}
                                                            {item.MC2 > 0 && <span>MC2: {item.MC2} 桶</span>} {item.S1 > 0 && <span>S1: {item.S1} 桶</span>}
                                                            {item.brownCarbon > 0 && <span>牛皮紙: {item.brownCarbon} 包</span>} {item.blackCarbon > 0 && <span>黑色: {item.blackCarbon} 包</span>}
                                                            {item.FB > 0 && <span>FB: {item.FB} 包</span>} {item.polymer > 0 && <span>高分子: {item.polymer} 包</span>}
                                                        </div>
                                                    </div>
                                                ))
                                            }
                                        </div>
                                        <button onClick={() => setStep(1)} className="w-full bg-slate-100 py-5 rounded-2xl font-bold active:scale-95 text-slate-500 h-16 border border-slate-200">返回</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
