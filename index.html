<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>TRT 藥劑配送</title><style>body{font:16px/1.7 system-ui;background:#f2f6f7;color:#173e49;margin:0;padding:40px 18px}main{max-width:480px;background:white;margin:10vh auto;padding:28px;border:1px solid #dbe6e9;border-radius:16px}button{background:#087f80;color:white;border:0;border-radius:10px;padding:14px 24px;font:inherit;cursor:pointer}small{color:#71858b}h1{font-size:24px}</style></head><body><main><h1>TRT 藥劑配送</h1><p id="status" role="status">正在開啟您的專屬入口…</p><button id="open" hidden>進入叫藥系統</button><p><small>請保留您的專屬連結，勿轉傳給其他公司。</small></p></main><script src="config.js"></script><script>
const statusEl=document.querySelector('#status'),button=document.querySelector('#open'),config=window.TRT_CONFIG||{},params=new URLSearchParams(location.hash.slice(1)),token=params.get('token')||'';
let validUrl=false;try{const url=new URL(config.webAppUrl);validUrl=url.origin==='https://script.google.com'&&/^\/macros\/s\/[^/]+\/exec$/.test(url.pathname)}catch(e){}
if(!validUrl)statusEl.textContent='新版系統尚未完成部署，請聯絡配送窗口。';else if(!/^[a-f0-9]{64}$/.test(token))statusEl.textContent='請使用公司專屬連結開啟，或向配送窗口索取連結。';else{statusEl.textContent='請點擊下方按鈕，開啟您的專屬叫藥頁面。';button.hidden=false;button.onclick=()=>location.assign(config.webAppUrl+'?token='+encodeURIComponent(token));}
</script></body></html>
