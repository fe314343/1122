<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- 軟體化核心設定：讓網頁變身 App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="藥劑配送">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e3a8a">
    
    <!-- 桌面圖示設定 (您的自訂圖片) -->
    <link rel="apple-touch-icon" href="0B5915F8-F88F-4653-AC6C-54FBE1D2ACCF.jpg">
    <link rel="manifest" href='data:application/manifest+json,{"name":"藥劑配送系統","short_name":"藥劑配送","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#1e3a8a","icons":[{"src":"0B5915F8-F88F-4653-AC6C-54FBE1D2ACCF.jpg","sizes":"512x512","type":"image/jpeg"}]}'>

    <title>藥劑配送管理系統</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        :root {
            --sat: env(safe-area-inset-top);
            --sab: env(safe-area-inset-bottom);
        }

        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: #f1f5f9;
            color: #1e293b;
            user-select: none; /* 防止誤觸選取文字，更有 App 感 */
            margin: 0;
            padding: 0;
        }
        
        /* 軟體化佈局：修正瀏海屏與底部操作條 */
        .app-container {
            min-height: 100vh;
            padding-top: var(--sat);
            padding-bottom: var(--sab);
        }

        .animate-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        button:active { transform: scale(0.96); }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxcZR0kYEldUdK-Qk_IyDpMpMEtMg4wlq0uI54UhXNZ21x36sVBovmMRgKCDtEc4IUc/exec";

        const Icons = {
            Building: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="18" x="5" y="3" rx="2" ry="2"/><path d="M9 21V9"/><path d="M15 21V9"/><path d="M5 9h14"/></svg>,
            History: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>,
            Package: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16.5 9.4 7.5 4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" x2="12" y1="22" y2="12"/></svg>,
            Send: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" x2="11" y1="2" y2="13"/><polyline points="22 2 15 22 11 13 2 9 22 2"/></svg>,
            CheckCircle: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            Back: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>,
            Refresh: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>,
            TruckFallback: () => <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-5l-4-4h-3v10a2 2 0 0 0 2 2Z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>
        };

        const AppIcon = ({ className = "" }) => {
            const [imgError, setImgError] = useState(false);
            const fileName = "0B5915F8-F88F-4653-AC6C-54FBE1D2ACCF.jpg";
            if (imgError) return <div className={`flex items-center justify-center bg-blue-800 ${className}`}><Icons.TruckFallback /></div>;
            return <img src={fileName} className={`object-cover ${className}`} alt="Icon" onError={() => setImgError(true)} />;
        };

        const App = () => {
            const [step, setStep] = useState(1);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            const [historyData, setHistoryData] = useState([]);
            const [formData, setFormData] = useState({
                companyName: '', K1: 0, L1: 0, MC2: 0, S1: 0,
                brownCarbon: 0, blackCarbon: 0, FB: 0, polymer: 0
            });

            const handleInputChange = (field, value) => {
                const val = Math.max(0, parseInt(value) || 0);
                setFormData(prev => ({ ...prev, [field]: val }));
            };

            const fetchHistory = async () => {
                const name = formData.companyName.trim();
                if (!name) { setError("請先輸入公司名稱"); return; }
                setLoading(true); setError("");
                try {
                    const response = await fetch(`${WEB_APP_URL}?action=getHistory&companyName=${encodeURIComponent(name)}&t=${Date.now()}`);
                    const text = await response.text();
                    let result = JSON.parse(text);
                    if (result.status === "Success") { setHistoryData(result.data || []); setStep(4); } 
                    else { setError(result.message); }
                } catch (err) { setError("連線失敗，請檢查權限或網路狀況。"); }
                finally { setLoading(false); }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true); setError("");
                try {
                    const params = new URLSearchParams();
                    Object.keys(formData).forEach(key => params.append(key, formData[key]));
                    await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: params.toString() });
                    setStep(3);
                } catch (err) { setError("提交發生錯誤。"); }
                finally { setLoading(false); }
            };

            const renderInput = (label, weight, field) => (
                <div className="flex items-center justify-between p-4 bg-gray-50 rounded-2xl mb-3 border border-gray-100 shadow-sm transition-all">
                    <div className="flex flex-col text-left">
                        <span className="font-bold text-gray-700">{label}</span>
                        <span className="text-[10px] text-blue-500 font-bold uppercase tracking-wider">{weight}</span>
                    </div>
                    <div className="flex items-center space-x-2">
                        <button type="button" onClick={() => setFormData({...formData, [field]: Math.max(0, formData[field] - 1)})} className="w-10 h-10 flex items-center justify-center bg-white border border-gray-200 rounded-xl shadow-sm font-bold active:bg-gray-100 transition-all text-xl">-</button>
                        <input type="number" value={formData[field]} onChange={(e) => setFormData({...formData, [field]: parseInt(e.target.value) || 0})} className="w-12 text-center bg-transparent font-black text-indigo-600 outline-none text-2xl" />
                        <button type="button" onClick={() => setFormData({...formData, [field]: formData[field] + 1})} className="w-10 h-10 flex items-center justify-center bg-white border border-gray-200 rounded-xl shadow-sm font-bold active:bg-gray-100 transition-all text-xl">+</button>
                    </div>
                </div>
            );

            return (
                <div className="app-container py-8 px-4 flex justify-center items-start">
                    <div className="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-gray-100 flex flex-col animate-in">
                        {/* 標題區域 */}
                        <div className="bg-gradient-to-br from-blue-700 to-indigo-900 p-8 text-white relative text-left">
                            <div className="absolute right-6 top-6 w-20 h-20 overflow-hidden rounded-2xl shadow-lg border-2 border-white/30 flex items-center justify-center bg-blue-800">
                                <AppIcon className="w-full h-full" />
                            </div>
                            <h1 className="text-3xl font-black mb-1 tracking-tight">藥劑配送</h1>
                            <p className="text-blue-100 opacity-80 text-xs font-medium uppercase tracking-widest italic">Stand-alone Mode</p>
                        </div>

                        <div className="p-8" key={step}>
                            {step === 1 && (
                                <div className="space-y-6 text-left animate-in">
                                    <div className="flex items-center space-x-2 text-indigo-600 font-bold"><Icons.Building /><span>身分確認</span></div>
                                    <input 
                                        type="text" 
                                        placeholder="輸入公司名稱" 
                                        className="w-full p-5 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-indigo-500 focus:bg-white text-lg font-medium shadow-inner transition-all" 
                                        value={formData.companyName} 
                                        onChange={(e) => setFormData({...formData, companyName: e.target.value})} 
                                    />
                                    <div className="grid grid-cols-1 gap-4">
                                        <button onClick={() => formData.companyName.trim() ? setStep(2) : setError("請輸入公司名稱")} className="w-full bg-indigo-600 text-white py-5 rounded-2xl font-bold shadow-xl transition-all h-16 text-lg">填寫需求單</button>
                                        <button onClick={fetchHistory} disabled={loading} className="w-full bg-white text-indigo-600 border-2 border-indigo-50 py-5 rounded-2xl font-bold flex items-center justify-center gap-2 transition-all h-16 text-lg shadow-sm">
                                            {loading ? <span className="animate-spin text-2xl">🌀</span> : <Icons.History />}
                                            <span>歷史紀錄</span>
                                        </button>
                                    </div>
                                    <p className="text-center text-[10px] text-slate-400 font-medium">提示：點擊瀏覽器選單「加入主畫面」可獲得最佳 App 體驗</p>
                                    {error && <div className="text-red-500 text-sm font-bold bg-red-50 p-4 rounded-2xl border border-red-100 text-center animate-in">{error}</div>}
                                </div>
                            )}

                            {step === 2 && (
                                <form onSubmit={handleSubmit} className="space-y-4 animate-in text-left">
                                    <div className="flex justify-between items-center mb-4">
                                        <div className="flex items-center gap-2 font-black text-indigo-600 text-xl"><Icons.Package /><span className="truncate max-w-[150px]">{formData.companyName}</span></div>
                                        <button type="button" onClick={() => setStep(1)} className="text-sm font-bold text-slate-400 underline decoration-2 underline-offset-4">返回修改</button>
                                    </div>
                                    <div className="max-h-[60vh] overflow-y-auto pr-2 custom-scrollbar">
                                        <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 ml-1">藥劑類 (桶)</h3>
                                        {renderInput("K1 藥劑", "25kg", "K1")}
                                        {renderInput("L1 藥劑", "25kg", "L1")}
                                        {renderInput("MC2 藥劑", "30kg", "MC2")}
                                        {renderInput("S1 藥劑", "25kg", "S1")}
                                        <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest mt-8 mb-4 ml-1 font-sans">粉劑類 (包)</h3>
                                        {renderInput("牛皮紙活性碳", "20kg", "brownCarbon")}
                                        {renderInput("黑色活性碳", "20kg", "blackCarbon")}
                                        {renderInput("FB", "25kg", "FB")}
                                        {renderInput("高分子", "25kg", "polymer")}
                                    </div>
                                    <button type="submit" disabled={loading} className="w-full bg-indigo-600 text-white py-5 rounded-2xl font-bold shadow-2xl mt-6 transition-all h-16 text-lg">{loading ? "同步中..." : "確認送出申請"}</button>
                                </form>
                            )}

                            {step === 3 && (
                                <div className="text-center py-12 space-y-8 animate-in text-slate-800">
                                    <div className="text-emerald-500 flex justify-center scale-125"><div className="w-20 h-20 bg-emerald-50 rounded-full flex items-center justify-center shadow-lg"><Icons.CheckCircle /></div></div>
                                    <div>
                                        <h2 className="text-3xl font-black text-slate-800">送出成功！</h2>
                                        <p className="text-slate-500 mt-3 font-medium px-4 leading-relaxed text-sm italic">資料已記錄。您可以隨時透過首頁查詢歷史紀錄。</p>
                                    </div>
                                    <button onClick={() => { setFormData({...formData, K1:0,L1:0,MC2:0,S1:0,brownCarbon:0,blackCarbon:0,FB:0,polymer:0}); setStep(1); }} className="w-full bg-slate-800 text-white py-5 rounded-2xl font-bold transition-all h-16 shadow-lg">返回首頁</button>
                                </div>
                            )}

                            {step === 4 && (
                                <div className="space-y-6 animate-in text-left">
                                    <div className="flex items-center justify-between mb-4">
                                        <div className="flex items-center gap-4">
                                            <button onClick={() => setStep(1)} className="p-3 bg-slate-50 rounded-2xl text-indigo-600 shadow-sm"><Icons.Back /></button>
                                            <h2 className="font-black text-2xl text-slate-800 tracking-tight">歷史紀錄</h2>
                                        </div>
                                        <button onClick={fetchHistory} className="p-3 bg-slate-50 rounded-2xl text-slate-400 shadow-sm"><Icons.Refresh /></button>
                                    </div>
                                    <div className="space-y-4 max-h-[60vh] overflow-y-auto pr-2 custom-scrollbar">
                                        {historyData.length === 0 ? <p className="text-center py-20 text-slate-400 italic font-medium">目前查無紀錄</p> : 
                                            historyData.map((item, i) => (
                                                <div key={i} className="bg-white p-5 rounded-[1.5rem] border border-slate-100 shadow-sm transition-all active:bg-slate-50">
                                                    <div className="font-black text-indigo-600 mb-3 border-b border-slate-50 pb-2 flex justify-between">
                                                        <span className="text-sm">{item.timestamp}</span>
                                                        <span className="text-[10px] text-slate-300 font-sans tracking-tighter">ORDER #{(historyData.length - i)}</span>
                                                    </div>
                                                    <div className="grid grid-cols-2 gap-x-4 gap-y-2 text-sm text-slate-600 font-bold">
                                                        {item.K1 > 0 && <span>K1: <span className="text-indigo-600">{item.K1} 桶</span></span>}
                                                        {item.L1 > 0 && <span>L1: <span className="text-indigo-600">{item.L1} 桶</span></span>}
                                                        {item.MC2 > 0 && <span>MC2: <span className="text-indigo-600">{item.MC2} 桶</span></span>}
                                                        {item.S1 > 0 && <span>S1: <span className="text-indigo-600">{item.S1} 桶</span></span>}
                                                        {item.brownCarbon > 0 && <span>牛皮紙: <span className="text-slate-800">{item.brownCarbon} 包</span></span>}
                                                        {item.blackCarbon > 0 && <span>黑色: <span className="text-slate-800">{item.blackCarbon} 包</span></span>}
                                                        {item.FB > 0 && <span>FB: <span className="text-slate-800">{item.FB} 包</span></span>}
                                                        {item.polymer > 0 && <span>高分子: <span className="text-slate-800">{item.polymer} 包</span></span>}
                                                    </div>
                                                </div>
                                            ))
                                        }
                                    </div>
                                    <button onClick={() => setStep(1)} className="w-full bg-slate-100 py-5 rounded-2xl font-bold text-slate-500 h-16 border border-slate-200 shadow-sm">返回首頁</button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
