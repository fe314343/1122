<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e3a8a">
    
    <!-- iOS 軟體化設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="藥劑配送">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1048/1048329.png">

    <title>藥劑配送管理系統</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"藥劑配送管理系統","short_name":"藥劑配送","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#1e3a8a","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/1048/1048329.png","sizes":"512x512","type":"image/png"}]}'>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            user-select: none; /* 讓它更像原生 App，防止長按選取文字 */
        }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }
        .fade-in-overlay { animation: fadeInScale 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInScale { from { opacity: 0; scale: 0.95; } to { opacity: 1; scale: 1; } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        
        /* 防止橡皮筋回彈效果，讓它更像軟體 */
        html, body {
            overflow: hidden;
            height: 100%;
            position: fixed;
            width: 100%;
        }
        #root {
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxcZR0kYEldUdK-Qk_IyDpMpMEtMg4wlq0uI54UhXNZ21x36sVBovmMRgKCDtEc4IUc/exec";

        const Icons = {
            Truck: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-5l-4-4h-3v10a2 2 0 0 0 2 2Z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>,
            Building: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="18" x="5" y="3" rx="2" ry="2"/><path d="M9 21V9"/><path d="M15 21V9"/><path d="M5 9h14"/></svg>,
            History: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>,
            Package: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16.5 9.4 7.5 4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" x2="12" y1="22" y2="12"/></svg>,
            Send: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" x2="11" y1="2" y2="13"/><polyline points="22 2 15 22 11 13 2 9 22 2"/></svg>,
            CheckCircle: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            Back: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>,
            Smartphone: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>,
            Share: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="22" y2="15"/></svg>,
            MoreVertical: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>,
            PlusSquare: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="12" x2="12" y1="8" y2="16"/><line x1="8" x2="16" y1="12" y2="12"/></svg>,
            Close: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>,
            Refresh: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        };

        const InstallGuideModal = ({ isOpen, onClose }) => {
            if (!isOpen) return null;
            const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/60 backdrop-blur-sm transition-all">
                    <div className="bg-white w-full max-w-sm rounded-3xl overflow-hidden shadow-2xl fade-in-overlay relative text-left">
                        <button onClick={onClose} className="absolute right-4 top-4 text-gray-400 hover:text-gray-600 p-2"><Icons.Close /></button>
                        <div className="p-8 text-center">
                            <div className="w-16 h-16 bg-indigo-100 rounded-2xl flex items-center justify-center mx-auto mb-6 text-indigo-600">
                                <Icons.Smartphone />
                            </div>
                            <h2 className="text-xl font-black text-gray-800 mb-2">安裝藥劑系統 App</h2>
                            <p className="text-gray-500 text-sm mb-8">將系統加入桌面，就像安裝了一個軟體，以後叫藥更快速、介面更清爽。</p>
                            <div className="space-y-6 text-left">
                                {isiOS ? (
                                    <React.Fragment>
                                        <div className="flex items-start gap-4">
                                            <div className="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center flex-shrink-0 font-bold text-sm">1</div>
                                            <p className="text-sm text-gray-600 leading-relaxed">點擊瀏覽器下方工具列的 <span className="inline-block p-1 bg-gray-100 rounded mx-1 align-middle"><Icons.Share /></span> <strong>「分享按鈕」</strong></p>
                                        </div>
                                        <div className="flex items-start gap-4">
                                            <div className="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center flex-shrink-0 font-bold text-sm">2</div>
                                            <p className="text-sm text-gray-600 leading-relaxed">選單向上滑動並點擊 <span className="inline-block p-1 bg-gray-100 rounded mx-1 align-middle"><Icons.PlusSquare /></span> <strong>「加入主畫面」</strong></p>
                                        </div>
                                    </React.Fragment>
                                ) : (
                                    <React.Fragment>
                                        <div className="flex items-start gap-4">
                                            <div className="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center flex-shrink-0 font-bold text-sm">1</div>
                                            <p className="text-sm text-gray-600 leading-relaxed">點擊瀏覽器右上角的 <span className="inline-block p-1 bg-gray-100 rounded mx-1 align-middle"><Icons.MoreVertical /></span> <strong>「更多按鈕」</strong></p>
                                        </div>
                                        <div className="flex items-start gap-4">
                                            <div className="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center flex-shrink-0 font-bold text-sm">2</div>
                                            <p className="text-sm text-gray-600 leading-relaxed">在選單中點擊 <strong>「安裝應用程式」</strong> 或 <strong>「加入主畫面」</strong></p>
                                        </div>
                                    </React.Fragment>
                                )}
                            </div>
                            <button onClick={onClose} className="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl mt-8 shadow-lg active:scale-95 transition-all">
                                我知道了
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [step, setStep] = useState(1);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            const [showPwaTip, setShowPwaTip] = useState(false);
            const [showInstallModal, setShowInstallModal] = useState(false);
            const [historyData, setHistoryData] = useState([]);
            const [formData, setFormData] = useState({
                companyName: '',
                K1: 0, L1: 0, MC2: 0, S1: 0,
                brownCarbon: 0, blackCarbon: 0, FB: 0, polymer: 0
            });

            useEffect(() => {
                const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
                if (!isStandalone) {
                    setShowPwaTip(true);
                }
            }, []);

            const handleInputChange = (field, value) => {
                const val = Math.max(0, parseInt(value) || 0);
                setFormData(prev => ({ ...prev, [field]: val }));
            };

            const fetchHistory = async () => {
                const name = formData.companyName.trim();
                if (!name) { setError("請先輸入公司名稱"); return; }
                setLoading(true); setError("");
                try {
                    const response = await fetch(`${WEB_APP_URL}?action=getHistory&companyName=${encodeURIComponent(name)}&t=${Date.now()}`);
                    const text = await response.text();
                    let result = JSON.parse(text);
                    if (result.status === "Success") {
                        setHistoryData(result.data || []);
                        setStep(4);
                    } else { setError(result.message); }
                } catch (err) { setError("連線失敗，請檢查權限設定。"); }
                finally { setLoading(false); }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true); setError("");
                try {
                    const params = new URLSearchParams();
                    Object.keys(formData).forEach(key => params.append(key, formData[key]));
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: params.toString()
                    });
                    setStep(3);
                } catch (err) { setError("送出發生錯誤。"); }
                finally { setLoading(false); }
            };

            const renderInput = (label, weight, field) => (
                <div className="flex items-center justify-between p-3 bg-gray-50 rounded-xl mb-2 border border-gray-100 shadow-sm">
                    <div className="flex flex-col text-left">
                        <span className="font-bold text-gray-700">{label}</span>
                        <span className="text-[10px] text-blue-500 font-bold uppercase">{weight}</span>
                    </div>
                    <div className="flex items-center space-x-2">
                        <button type="button" onClick={() => setFormData({...formData, [field]: Math.max(0, formData[field] - 1)})} className="w-9 h-9 flex items-center justify-center bg-white border rounded-lg shadow-sm font-bold active:bg-gray-100">-</button>
                        <input type="number" value={formData[field]} onChange={(e) => setFormData({...formData, [field]: parseInt(e.target.value) || 0})} className="w-10 text-center bg-transparent font-black text-blue-600 outline-none text-lg" />
                        <button type="button" onClick={() => setFormData({...formData, [field]: formData[field] + 1})} className="w-9 h-9 flex items-center justify-center bg-white border rounded-lg shadow-sm font-bold active:bg-gray-100">+</button>
                    </div>
                </div>
            );

            return (
                <div className="flex flex-col h-full overflow-hidden">
                    <InstallGuideModal isOpen={showInstallModal} onClose={() => setShowInstallModal(false)} />
                    
                    <div className="flex-1 overflow-y-auto p-4 flex items-center justify-center">
                        <div className="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100 flex flex-col">
                            <div className="bg-gradient-to-br from-blue-700 to-indigo-900 p-8 text-white relative text-left flex-shrink-0">
                                <div className="absolute right-6 top-6 opacity-20 w-16 h-16"><Icons.Truck /></div>
                                <h1 className="text-2xl font-black mb-1 tracking-tight">藥劑配送管理系統</h1>
                                <p className="text-blue-100 opacity-80 text-xs font-medium uppercase tracking-widest text-left">PWA Mobile Version</p>
                            </div>

                            {showPwaTip && step === 1 && (
                                <div onClick={() => setShowInstallModal(true)} className="bg-indigo-600 p-3 flex items-center justify-between text-white text-[11px] font-bold animate-in cursor-pointer hover:bg-indigo-700 transition-colors flex-shrink-0">
                                    <div className="flex items-center gap-2">
                                        <Icons.Smartphone />
                                        <span>點擊查看「如何安裝成手機軟體」引導</span>
                                    </div>
                                    <span className="opacity-70 text-[14px]">➜</span>
                                </div>
                            )}

                            <div className="p-8 overflow-y-auto" key={step}>
                                {step === 1 && (
                                    <div className="space-y-6 text-left animate-in">
                                        <div className="flex items-center space-x-2 text-indigo-600 font-bold"><Icons.Building /><span>身分確認</span></div>
                                        <input type="text" placeholder="輸入您的公司名稱" className="w-full p-4 bg-gray-50 border-2 rounded-2xl outline-none focus:border-indigo-500 text-lg font-medium shadow-inner transition-all" value={formData.companyName} onChange={(e) => setFormData({...formData, companyName: e.target.value})} />
                                        <div className="grid grid-cols-1 gap-3">
                                            <button onClick={() => formData.companyName.trim() ? setStep(2) : setError("請先輸入公司名稱")} className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition-all h-14">填寫配送單需求</button>
                                            <button onClick={fetchHistory} disabled={loading} className="w-full bg-white text-indigo-600 border-2 border-indigo-100 py-4 rounded-2xl font-bold flex items-center justify-center gap-2 active:scale-95 transition-all h-14">
                                                {loading ? <span className="animate-spin text-xl">🌀</span> : <Icons.History />}
                                                <span>查看我的歷史紀錄</span>
                                            </button>
                                        </div>
                                        {error && <div className="text-red-500 text-sm font-bold bg-red-50 p-4 rounded-xl border border-red-100 text-center leading-relaxed">{error}</div>}
                                    </div>
                                )}

                                {step === 2 && (
                                    <form onSubmit={handleSubmit} className="space-y-4 animate-in text-left">
                                        <div className="flex justify-between items-center mb-2">
                                            <div className="flex items-center gap-2 font-bold text-indigo-600"><Icons.Package /><span className="truncate max-w-[150px]">{formData.companyName}</span></div>
                                            <button type="button" onClick={() => setStep(1)} className="text-xs text-gray-400 underline uppercase tracking-tighter">返回</button>
                                        </div>
                                        <div className="max-h-[45vh] overflow-y-auto pr-2 custom-scrollbar">
                                            <h3 className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 ml-1">藥劑 (桶裝)</h3>
                                            {renderInput("K1 藥劑", "25kg", "K1")}
                                            {renderInput("L1 藥劑", "25kg", "L1")}
                                            {renderInput("MC2 藥劑", "30kg", "MC2")}
                                            {renderInput("S1 藥劑", "25kg", "S1")}
                                            <h3 className="text-[10px] font-black text-gray-400 uppercase tracking-widest mt-4 mb-2 ml-1">粉劑 (包裝)</h3>
                                            {renderInput("牛皮紙活性碳", "20kg", "brownCarbon")}
                                            {renderInput("黑色活性碳", "20kg", "blackCarbon")}
                                            {renderInput("FB", "25kg", "FB")}
                                            {renderInput("高分子", "25kg", "polymer")}
                                        </div>
                                        <button type="submit" disabled={loading} className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg mt-4 active:scale-95 transition-all h-14">{loading ? "正在同步資料..." : "確認送出配送申請"}</button>
                                    </form>
                                )}

                                {step === 3 && (
                                    <div className="text-center py-10 space-y-6 animate-in">
                                        <div className="text-green-500 flex justify-center"><div className="w-16 h-16"><Icons.CheckCircle /></div></div>
                                        <h2 className="text-2xl font-black text-gray-800">配送申請已送出！</h2>
                                        <p className="text-gray-500 text-sm px-4">資料已成功同步。您可以點擊下方按鈕返回首頁。</p>
                                        <button onClick={() => { setFormData({...formData, K1:0,L1:0,MC2:0,S1:0,brownCarbon:0,blackCarbon:0,FB:0,polymer:0}); setStep(1); }} className="w-full bg-gray-100 text-gray-600 py-4 rounded-2xl font-bold active:scale-95 h-14">返回首頁</button>
                                    </div>
                                )}

                                {step === 4 && (
                                    <div className="space-y-4 animate-in text-left">
                                        <div className="flex items-center justify-between mb-2">
                                            <div className="flex items-center gap-4">
                                                <button onClick={() => setStep(1)} className="p-2 hover:bg-gray-100 rounded-full transition-all text-indigo-600"><Icons.Back /></button>
                                                <h2 className="font-bold text-lg text-gray-700">歷史紀錄</h2>
                                            </div>
                                            <button onClick={fetchHistory} className="p-2 text-gray-400 active:rotate-180 transition-transform duration-500"><Icons.Refresh /></button>
                                        </div>
                                        <div className="space-y-3 max-h-[50vh] overflow-y-auto pr-2 custom-scrollbar">
                                            {historyData.length === 0 ? <p className="text-center py-20 text-gray-400 italic font-medium">查無相關紀錄</p> : 
                                                historyData.map((item, i) => (
                                                    <div key={i} className="bg-gray-50 p-4 rounded-2xl border border-gray-100 text-sm shadow-sm transition-all hover:bg-white hover:border-indigo-100">
                                                        <div className="font-black text-indigo-500 mb-2 border-b pb-1 flex justify-between">
                                                            <span>{item.timestamp}</span>
                                                            <span className="text-[10px] text-gray-300">#{(historyData.length - i).toString().padStart(3, '0')}</span>
                                                        </div>
                                                        <div className="grid grid-cols-2 gap-y-1 text-gray-600 font-medium italic">
                                                            {item.K1 > 0 && <span>K1: {item.K1} 桶</span>}
                                                            {item.L1 > 0 && <span>L1: {item.L1} 桶</span>}
                                                            {item.MC2 > 0 && <span>MC2: {item.MC2} 桶</span>}
                                                            {item.S1 > 0 && <span>S1: {item.S1} 桶</span>}
                                                            {item.brownCarbon > 0 && <span>牛皮紙: {item.brownCarbon} 包</span>}
                                                            {item.blackCarbon > 0 && <span>黑色: {item.blackCarbon} 包</span>}
                                                            {item.FB > 0 && <span>FB: {item.FB} 包</span>}
                                                            {item.polymer > 0 && <span>高分子: {item.polymer} 包</span>}
                                                        </div>
                                                    </div>
                                                ))
                                            }
                                        </div>
                                        <button onClick={() => setStep(1)} className="w-full bg-gray-100 py-4 rounded-2xl font-bold active:scale-95 transition-all text-gray-600 h-14">返回首頁</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
