<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藥劑配送需求系統</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 React 核心庫 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 載入 Babel 用於瀏覽器端解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 載入 Lucide 圖示 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .animate-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- 關鍵步驟：請確保此 URL 與您的 Google Apps Script 一致 ---
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyPSaG2bGsMvsHmMRQy9jQVMQdQ08Ws4oyiZZL-AQbNF6BXRdN6dOEqQQMV0XMe8gLZ/exec";

        const App = () => {
            const [step, setStep] = useState(1);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            const [formData, setFormData] = useState({
                companyName: '',
                K1: 0, L1: 0, MC2: 0, S1: 0,
                brownCarbon: 0, 
                blackCarbon: 0, 
                FB: 0,
                polymer: 0
            });

            const handleInputChange = (field, value) => {
                const val = Math.max(0, parseInt(value) || 0);
                setFormData(prev => ({ ...prev, [field]: val }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.companyName.trim()) {
                    setError("請先輸入公司名稱");
                    return;
                }

                setLoading(true);
                setError("");

                try {
                    const params = new URLSearchParams();
                    Object.keys(formData).forEach(key => {
                        params.append(key, formData[key]);
                    });

                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors', 
                        cache: 'no-cache',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: params.toString()
                    });
                    
                    setStep(3);
                } catch (err) {
                    console.error("傳送失敗:", err);
                    setError("連線異常，請確認您的網路狀況。");
                } finally {
                    setLoading(false);
                }
            };

            const renderNumberInput = (label, weight, field, unit) => (
                <div className="flex items-center justify-between p-4 bg-gray-50 rounded-xl mb-3 border border-gray-100 transition-all hover:border-blue-200 shadow-sm">
                    <div className="flex flex-col text-left">
                        <span className="font-semibold text-gray-700 text-base">{label}</span>
                        <span className="text-[10px] text-blue-500 font-bold tracking-wider uppercase">{weight}</span>
                    </div>
                    <div className="flex items-center space-x-3">
                        <button 
                            type="button"
                            onClick={() => handleInputChange(field, formData[field] - 1)}
                            className="w-10 h-10 flex items-center justify-center bg-white border border-gray-200 rounded-lg text-gray-600 hover:bg-gray-100 active:bg-gray-200 transition-all shadow-sm font-bold"
                        >-</button>
                        <input
                            type="number"
                            value={formData[field]}
                            onChange={(e) => handleInputChange(field, e.target.value)}
                            className="w-12 text-center bg-transparent font-bold text-blue-600 focus:outline-none text-lg"
                        />
                        <button 
                            type="button"
                            onClick={() => handleInputChange(field, formData[field] + 1)}
                            className="w-10 h-10 flex items-center justify-center bg-white border border-gray-200 rounded-lg text-gray-600 hover:bg-gray-100 active:bg-gray-200 transition-all shadow-sm font-bold"
                        >+</button>
                        <span className="text-sm text-gray-400 w-6 text-right font-medium">{unit}</span>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
                        
                        <div className="bg-gradient-to-br from-blue-700 to-indigo-900 p-8 text-white relative">
                            <i data-lucide="truck" className="absolute right-6 top-6 opacity-20 w-16 h-16"></i>
                            <h1 className="text-2xl font-black mb-1 tracking-tight">藥劑配送需求系統</h1>
                            <p className="text-blue-100 opacity-80 text-xs font-medium uppercase tracking-widest">Digital Supply Chain Management</p>
                        </div>

                        <div className="p-8">
                            {step === 1 && (
                                <div className="space-y-6 text-left animate-in">
                                    <div className="flex items-center space-x-2 text-indigo-600 mb-2 font-bold">
                                        <i data-lucide="building-2" className="w-5 h-5"></i>
                                        <span>請輸入您的公司名稱</span>
                                    </div>
                                    <input
                                        type="text"
                                        placeholder="例如：OO 化工廠"
                                        className="w-full p-4 pl-5 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-indigo-500 outline-none transition-all text-lg font-medium shadow-inner"
                                        value={formData.companyName}
                                        onChange={(e) => setFormData({...formData, companyName: e.target.value})}
                                    />
                                    <button
                                        onClick={() => formData.companyName.trim() ? setStep(2) : setError("請先輸入公司名稱")}
                                        className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold hover:bg-indigo-700 transition-all shadow-lg active:scale-95 flex items-center justify-center space-x-2"
                                    >
                                        <span>開始填寫訂單需求</span>
                                    </button>
                                    {error && <p className="text-red-500 text-sm text-center font-bold bg-red-50 p-3 rounded-xl border border-red-100">{error}</p>}
                                </div>
                            )}

                            {step === 2 && (
                                <form onSubmit={handleSubmit} className="space-y-6 animate-in">
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center space-x-2 text-indigo-600 font-bold">
                                            <i data-lucide="package" className="w-5 h-5"></i>
                                            <span className="truncate max-w-[200px]">{formData.companyName}</span>
                                        </div>
                                        <button type="button" onClick={() => setStep(1)} className="text-[10px] text-gray-400 underline uppercase tracking-tighter">修改名稱</button>
                                    </div>

                                    <div className="space-y-1">
                                        <h3 className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3 ml-1 text-left">液體藥劑 (桶裝計量)</h3>
                                        {renderNumberInput("K1 藥劑", "25kg / 桶", "K1", "桶")}
                                        {renderNumberInput("L1 藥劑", "25kg / 桶", "L1", "桶")}
                                        {renderNumberInput("MC2 藥劑", "30kg / 桶", "MC2", "桶")}
                                        {renderNumberInput("S1 藥劑", "25kg / 桶", "S1", "桶")}
                                    </div>

                                    <div className="space-y-1 mt-6">
                                        <h3 className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3 ml-1 text-left">粉劑/活性碳 (包裝計量)</h3>
                                        {renderNumberInput("牛皮紙活性碳", "20kg / 包", "brownCarbon", "包")}
                                        {renderNumberInput("黑色活性碳", "20kg / 包", "blackCarbon", "包")}
                                        {renderNumberInput("FB", "25kg / 包", "FB", "包")}
                                        {renderNumberInput("高分子", "25kg / 包", "polymer", "包")}
                                    </div>

                                    <button
                                        type="submit"
                                        disabled={loading}
                                        className={`w-full py-4 rounded-2xl font-bold flex items-center justify-center space-x-2 shadow-xl transition-all ${
                                            loading ? 'bg-gray-400 cursor-wait' : 'bg-indigo-600 hover:bg-indigo-700 text-white active:scale-[0.98]'
                                        }`}
                                    >
                                        {loading ? <span className="animate-spin text-xl">🌀</span> : <i data-lucide="send" className="w-5 h-5"></i>}
                                        <span>{loading ? "正在同步資料至 Excel..." : "確認並送出申請"}</span>
                                    </button>
                                </form>
                            )}

                            {step === 3 && (
                                <div className="text-center py-10 space-y-6 animate-in">
                                    <div className="flex justify-center text-green-500">
                                        <i data-lucide="check-circle-2" className="w-16 h-16"></i>
                                    </div>
                                    <div>
                                        <h2 className="text-2xl font-black text-gray-800">申請送出成功！</h2>
                                        <p className="text-gray-500 mt-2 text-sm leading-relaxed px-4">
                                            資料已成功記錄至 Excel 表格。<br />
                                            <span className="text-indigo-600 font-bold">{formData.companyName}</span> 的配送需求我們已接收。
                                        </p>
                                    </div>
                                    <button
                                        onClick={() => { 
                                            setFormData({ companyName: '', K1: 0, L1: 0, MC2: 0, S1: 0, brownCarbon: 0, blackCarbon: 0, FB: 0, polymer: 0 }); 
                                            setStep(1); 
                                        }}
                                        className="w-full bg-gray-100 text-gray-600 py-4 rounded-2xl font-bold hover:bg-gray-200 transition-all shadow-sm active:scale-95"
                                    >
                                        回首頁填寫新單據
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // 初始化 React 並掛載
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // 確保圖示在 DOM 載入後初始化
        const initIcons = () => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        };
        // 在組件渲染後持續檢查並更新圖示
        setInterval(initIcons, 1000);
    </script>
</body>
</html>
