<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藥劑配送需求系統 - 含歷史紀錄</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 React 核心庫 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 載入 Babel 用於瀏覽器端解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        /* 捲軸美化 */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 關鍵步驟：請確保此 URL 與您的 Google Apps Script 一致 ---
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyPSaG2bGsMvsHmMRQy9jQVMQdQ08Ws4oyiZZL-AQbNF6BXRdN6dOEqQQMV0XMe8gLZ/exec";

        // 圖示組件
        const TruckIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-5l-4-4h-3v10a2 2 0 0 0 2 2Z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>;
        const BuildingIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M8 10h.01"/><path d="M16 10h.01"/><path d="M8 14h.01"/><path d="M16 14h.01"/></svg>;
        const HistoryIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>;
        const ArrowLeftIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>;
        const PackageIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16.5 9.4 7.5 4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" x2="12" y1="22" y2="12"/></svg>;
        const SendIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" x2="11" y1="2" y2="13"/><polyline points="22 2 15 22 11 13 2 9 22 2"/></svg>;

        const App = () => {
            const [step, setStep] = useState(1); // 1:首頁, 2:填寫, 3:成功, 4:歷史紀錄
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            const [historyData, setHistoryData] = useState([]);
            const [formData, setFormData] = useState({
                companyName: '',
                K1: 0, L1: 0, MC2: 0, S1: 0,
                brownCarbon: 0, blackCarbon: 0, FB: 0, polymer: 0
            });

            const handleInputChange = (field, value) => {
                const val = Math.max(0, parseInt(value) || 0);
                setFormData(prev => ({ ...prev, [field]: val }));
            };

            const fetchHistory = async () => {
                if (!formData.companyName.trim()) {
                    setError("請先輸入公司名稱以查詢紀錄");
                    return;
                }
                setLoading(true);
                setError("");
                try {
                    // 使用 GET 請求查詢歷史
                    const response = await fetch(`${WEB_APP_URL}?action=getHistory&companyName=${encodeURIComponent(formData.companyName.trim())}`);
                    const result = await response.json();
                    if (result.status === "Success") {
                        setHistoryData(result.data);
                        setStep(4);
                    } else {
                        setError(result.message || "查無此公司的歷史紀錄");
                    }
                } catch (err) {
                    setError("連線失敗，請檢查網路狀況");
                } finally {
                    setLoading(false);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    const params = new URLSearchParams();
                    Object.keys(formData).forEach(key => params.append(key, formData[key]));
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: params.toString()
                    });
                    setStep(3);
                } catch (err) {
                    setError("發送失敗，請重試");
                } finally {
                    setLoading(false);
                }
            };

            const renderNumberInput = (label, weight, field, unit) => (
                <div className="flex items-center justify-between p-4 bg-gray-50 rounded-xl mb-3 border border-gray-100 shadow-sm">
                    <div className="flex flex-col text-left">
                        <span className="font-semibold text-gray-700">{label}</span>
                        <span className="text-[10px] text-blue-500 font-bold uppercase">{weight}</span>
                    </div>
                    <div className="flex items-center space-x-3">
                        <button type="button" onClick={() => handleInputChange(field, formData[field] - 1)} className="w-8 h-8 flex items-center justify-center bg-white border rounded-lg text-gray-600">-</button>
                        <input type="number" value={formData[field]} onChange={(e) => handleInputChange(field, e.target.value)} className="w-12 text-center bg-transparent font-bold text-blue-600 focus:outline-none text-lg" />
                        <button type="button" onClick={() => handleInputChange(field, formData[field] + 1)} className="w-8 h-8 flex items-center justify-center bg-white border rounded-lg text-gray-600">+</button>
                        <span className="text-sm text-gray-400 w-6 text-right font-medium">{unit}</span>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
                        <div className="bg-gradient-to-br from-blue-700 to-indigo-900 p-8 text-white relative">
                            <div className="absolute right-6 top-6 opacity-20 w-16 h-16"><TruckIcon /></div>
                            <h1 className="text-2xl font-black mb-1 tracking-tight text-left">藥劑配送系統</h1>
                            <p className="text-blue-100 opacity-80 text-xs font-medium uppercase tracking-widest text-left">Management System</p>
                        </div>

                        <div className="p-8" key={step}>
                            {step === 1 && (
                                <div className="space-y-6 text-left animate-in">
                                    <div className="flex items-center space-x-2 text-indigo-600 font-bold"><BuildingIcon /><span>身分確認</span></div>
                                    <input type="text" placeholder="例如：OO 化工廠" className="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-indigo-500 outline-none text-lg font-medium" value={formData.companyName} onChange={(e) => setFormData({...formData, companyName: e.target.value})} />
                                    <div className="grid grid-cols-1 gap-3">
                                        <button onClick={() => formData.companyName.trim() ? setStep(2) : setError("請先輸入公司名稱")} className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold hover:bg-indigo-700 transition-all shadow-lg flex items-center justify-center space-x-2">
                                            <span>開始填寫訂單</span>
                                        </button>
                                        <button onClick={fetchHistory} disabled={loading} className="w-full bg-white text-indigo-600 border-2 border-indigo-100 py-4 rounded-2xl font-bold hover:bg-indigo-50 transition-all flex items-center justify-center space-x-2">
                                            {loading ? <span className="animate-spin">🌀</span> : <HistoryIcon />}
                                            <span>查看我的歷史紀錄</span>
                                        </button>
                                    </div>
                                    {error && <p className="text-red-500 text-sm text-center font-bold bg-red-50 p-3 rounded-xl border border-red-100">{error}</p>}
                                </div>
                            )}

                            {step === 2 && (
                                <form onSubmit={handleSubmit} className="space-y-6 animate-in text-left">
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center space-x-2 text-indigo-600 font-bold"><PackageIcon /><span className="truncate max-w-[150px]">{formData.companyName}</span></div>
                                        <button type="button" onClick={() => setStep(1)} className="text-[10px] text-gray-400 underline uppercase tracking-tighter">修改名稱</button>
                                    </div>
                                    <div className="space-y-1 overflow-y-auto max-h-[400px] pr-2 custom-scrollbar">
                                        <h3 className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3 ml-1">藥劑 (桶裝)</h3>
                                        {renderNumberInput("K1 藥劑", "25kg", "K1", "桶")}
                                        {renderNumberInput("L1 藥劑", "25kg", "L1", "桶")}
                                        {renderNumberInput("MC2 藥劑", "30kg", "MC2", "桶")}
                                        {renderNumberInput("S1 藥劑", "25kg", "S1", "桶")}
                                        <h3 className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3 mt-6 ml-1">粉劑/活性碳 (包裝)</h3>
                                        {renderNumberInput("牛皮紙活性碳", "20kg", "brownCarbon", "包")}
                                        {renderNumberInput("黑色活性碳", "20kg", "blackCarbon", "包")}
                                        {renderNumberInput("FB", "25kg", "FB", "包")}
                                        {renderNumberInput("高分子", "25kg", "polymer", "包")}
                                    </div>
                                    <button type="submit" disabled={loading} className={`w-full py-4 rounded-2xl font-bold flex items-center justify-center space-x-2 shadow-xl ${loading ? 'bg-gray-400' : 'bg-indigo-600 hover:bg-indigo-700 text-white'}`}>
                                        {loading ? <span className="animate-spin text-xl">🌀</span> : <SendIcon />}
                                        <span>確認並送出申請</span>
                                    </button>
                                </form>
                            )}

                            {step === 3 && (
                                <div className="text-center py-10 space-y-6 animate-in">
                                    <div className="flex justify-center text-green-500"><div className="w-16 h-16"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></div></div>
                                    <h2 className="text-2xl font-black text-gray-800">申請送出成功！</h2>
                                    <button onClick={() => setStep(1)} className="w-full bg-gray-100 text-gray-600 py-4 rounded-2xl font-bold hover:bg-gray-200 transition-all">返回首頁</button>
                                </div>
                            )}

                            {step === 4 && (
                                <div className="space-y-6 animate-in text-left">
                                    <div className="flex items-center justify-between">
                                        <button onClick={() => setStep(1)} className="p-2 hover:bg-gray-100 rounded-full transition-all text-gray-500"><ArrowLeftIcon /></button>
                                        <h2 className="font-bold text-gray-700 text-lg">歷史叫貨紀錄</h2>
                                        <div className="w-10"></div>
                                    </div>
                                    <div className="space-y-4 max-h-[500px] overflow-y-auto pr-2 custom-scrollbar">
                                        {historyData.map((order, idx) => (
                                            <div key={idx} className="bg-gray-50 border border-gray-100 p-4 rounded-2xl shadow-sm">
                                                <div className="text-xs font-bold text-indigo-500 mb-2">{order.time}</div>
                                                <div className="grid grid-cols-2 gap-2 text-sm text-gray-600">
                                                    {order.K1 > 0 && <div>K1: {order.K1} 桶</div>}
                                                    {order.L1 > 0 && <div>L1: {order.L1} 桶</div>}
                                                    {order.MC2 > 0 && <div>MC2: {order.MC2} 桶</div>}
                                                    {order.S1 > 0 && <div>S1: {order.S1} 桶</div>}
                                                    {order.brownCarbon > 0 && <div>牛皮紙: {order.brownCarbon} 包</div>}
                                                    {order.blackCarbon > 0 && <div>黑色: {order.blackCarbon} 包</div>}
                                                    {order.FB > 0 && <div>FB: {order.FB} 包</div>}
                                                    {order.polymer > 0 && <div>高分子: {order.polymer} 包</div>}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
